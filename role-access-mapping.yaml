# Role -> Access Mapping and System Criticality.
#
# Baseline access each role receives automatically, per access-control-policy.md's
# Role-based Access and Initial Access Principles. This is the machine-consumed
# "ought" side of the comparison the agent reasons against — single source of
# truth, no separate human-readable duplicate (see ADR-0004: this content was
# always a structured table, never policy prose, so there's no narrative-
# readability need a YAML format doesn't already satisfy).
#
# Access levels: none | read | write | admin. Some entries carry a scope note
# (e.g. Contractor's GitHub access is repo-scoped, VPN access is contract-limited)
# — kept as free-text `note` fields alongside the level, not modeled further in v1.

role_access_mapping:
  - role: Software Engineer
    access:
      aws: { level: write, note: non-prod }
      github: { level: write }
      salesforce: { level: none }
      finance_erp: { level: none }
      vpn: { level: yes }

  - role: Engineering Manager
    access:
      aws: { level: write }
      github: { level: admin }
      salesforce: { level: none }
      finance_erp: { level: none }
      vpn: { level: yes }

  - role: Asset Owner
    access:
      aws: { level: admin }
      github: { level: admin }
      salesforce: { level: admin, note: user management only }
      finance_erp: { level: none }
      vpn: { level: yes }

  - role: HR Admin
    access:
      aws: { level: none }
      github: { level: none }
      salesforce: { level: none }
      finance_erp: { level: read }
      vpn: { level: yes }

  - role: Finance Analyst
    access:
      aws: { level: none }
      github: { level: none }
      salesforce: { level: read }
      finance_erp: { level: write }
      vpn: { level: yes }

  - role: Sales Rep
    access:
      aws: { level: none }
      github: { level: none }
      salesforce: { level: write }
      finance_erp: { level: none }
      vpn: { level: yes }

  - role: Executive (C-level)
    access:
      aws: { level: none }
      github: { level: none }
      salesforce: { level: read }
      finance_erp: { level: read }
      vpn: { level: yes }

  - role: Contractor
    access:
      aws: { level: none }
      github: { level: write, note: scoped to assigned repo only }
      salesforce: { level: none }
      finance_erp: { level: none }
      vpn: { level: yes, note: time-limited to contract end date }

# Fixed per-system criticality rating. Feeds the Impact axis of Risk Assessment
# scoring (see ADR-0002) — a lookup, not a judgment call at reasoning time.
system_criticality:
  finance_erp: Critical
  aws: High
  salesforce: High
  github: Medium
  vpn: Low
